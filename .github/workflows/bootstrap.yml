name: Bootstrap

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu latest (x86_64)
            runner: ubuntu-latest
            architecture: x86_64
          - name: Ubuntu 22.04 (x86_64)
            runner: ubuntu-22.04
            architecture: x86_64
          - name: Ubuntu 24.04 (ARM64)
            runner: ubuntu-24.04-arm
            architecture: aarch64
          - name: Ubuntu 22.04 (ARM64)
            runner: ubuntu-22.04-arm
            architecture: aarch64
          - name: macOS latest (Apple Silicon)
            runner: macos-latest
            architecture: arm64
          - name: macOS 15 (Intel)
            runner: macos-15-intel
            architecture: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n test.sh
          bash -n webshell/install.sh

      - name: Run negative tests
        run: ./test.sh

      - name: Prepare isolated home directory
        run: |
          ci_home="$RUNNER_TEMP/setup-home"
          mkdir -p "$ci_home"
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$ci_home/.setup"
          echo "HOME=$ci_home" >> "$GITHUB_ENV"

      - name: Run bootstrap
        run: bash install.sh

      - name: Add user-installed tools to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      # No success-path assertions here: install.sh proves its own results on
      # every run (assert_installed / assert_runs / assert_* helpers) and exits
      # nonzero if anything is missing or does not execute, so running it IS
      # the check. Negative tests live in test.sh. See STYLE_GUIDE.md.
      - name: Verify bootstrap is safe to re-run
        run: bash install.sh

      # Webshell (Linux-only: requires systemd). The installer's built-in
      # verify() fails nonzero unless the service is active, the deployed unit
      # matches the intended mode, auth is enforced, and session restore works.
      - name: Install webshell (private mode)
        if: runner.os == 'Linux'
        run: WEBSHELL_PASSWORD=ci-test-password webshell/install.sh

      - name: Verify webshell health check passes standalone
        if: runner.os == 'Linux'
        run: webshell/install.sh --verify-only

      - name: Verify webshell is safe to re-run (password not rotated)
        if: runner.os == 'Linux'
        run: |
          webshell/install.sh | tee rerun.log
          grep -q "ttyd.service unchanged" rerun.log
